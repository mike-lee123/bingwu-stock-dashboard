version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_stock_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stock_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ai_stock_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
